  <body>
    <div class="promptrText">
      <h1>Autoquence</h1>
    </div>

    <!-- Filled by auth.js: profile avatar + menu (index page only) -->
    <div id="profileSlot"></div>

    <div id="addP" class="addPage">+</div>

    <div class="tapInstruction">
      <form
        id="uploadForm"
        action="{{ url_for('upload') }}"
        method="POST"
        enctype="multipart/form-data"
      >
        <input
          type="file"
          id="videoInput"
          name="video"
          accept="video/*"
          style="display: none"
        />
      </form>
      <p>Tap the icon to add a short video</p>
    </div>

    <!-- Upload overlay -->
    <div id="uploadOverlay" style="display: none">
      <div id="uploadCard">
        <div id="spinnerRing"></div>
        <p id="uploadLabel">Uploading video…</p>
        <div id="progressTrack">
          <div id="progressBar"></div>
        </div>
        <p id="uploadPercent">0%</p>
      </div>
    </div>

    <!-- Scripts go LAST so they can find the overlay div above -->
    <!-- <script src="{{ url_for('static', filename='script.js') }}"></script> -->
    <script src="{{ static_v('upload.js') }}"></script>
    <!-- Firebase config must load BEFORE auth.js (module) -->
    <script src="{{ static_v('firebase-config.js') }}"></script>
    <!-- Firebase auth: session check + profile avatar -->
    <script type="module" src="{{ static_v('auth.js') }}"></script>
  </body>
</html>
