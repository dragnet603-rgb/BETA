  <body>
    <div id="loginCard">
      <h1>Autoquence</h1>
      <p class="sub">Sign in to continue</p>

      <div id="authError" class="authError" style="display:none"></div>
      <div id="authStatus" class="authStatus"></div>

      <button id="googleBtn" class="btn google">
        Continue with Google
      </button>

      <div class="divider">or</div>

      <form id="passwordForm">
        <h2 id="passwordTitle">Sign in</h2>
        <input type="email" name="email" placeholder="Email" required />
        <input
          type="password"
          name="password"
          placeholder="Password"
          minlength="6"
          required
        />
        <button type="submit" class="btn primary">Continue</button>
        <a href="#" id="toggleSignup" class="toggle">New here? Create an account</a>
      </form>
    </div>

    <!-- Firebase config placeholder: edit static/firebase-config.js -->

    <script>
      window.FIREBASE_CONFIG_MISSING = Object.values(
        window.FIREBASE_CONFIG || {}
      ).some((v) => !v || String(v).startsWith("PASTE_"));
    </script>
    <script type="module" src="{{ static_v('auth.js') }}"></script>
