<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Canvas - Autoquence</title>
    <link
      rel="stylesheet"
      href="{{ static_v('canvas.css') }}"
    />
    <!-- Preload the Autoquence logo so it's cached before the first AI
         response box appears. The logo is a CSS background-image on the
         response box's ::before pseudo-element, which is fetched lazily —
         preloading avoids the visible delay on first use.
         (WebP: ~20x smaller than the original PNG.) -->
    <link
      rel="preload"
      as="image"
      href="{{ static_v('images/autoquence.webp') }}"
    />
<!-- PostHog analytics (privacy-friendly product analytics).
         Loader loads posthog-js from the CDN; safe no-op if blocked. -->

        defaults: '2026-05-30',
        // 'always' so anonymous visitors still get a person profile — we don't

  </head>
  </head>
  <body>
    <div class="promptrText">
      <a class="link" href="{{ url_for('index') }}"><h1>Autoquence</h1></a>
    </div>

    <!-- Undo / Redo -->
    <!-- <div id="undoRedoBar">
      <button id="undoBtn" class="aq-icon-btn" title="Undo (Ctrl+Z)" disabled>↩</button>
      <button id="redoBtn" class="aq-icon-btn" title="Redo (Ctrl+Y)" disabled>↪</button>
    </div> -->

    <div id="Export" class="export">
      <h1>Export</h1>
    </div>

    <div class="canvas-container">
      <div class="canvas">
        <video id="videoPreview" playsinline>
          <source
            src="{{ url_for('static', filename='uploads/' + filename) }}"
            type="video/mp4"
          />

          Your browser does not support the video tag.
        </video>
        <div id="editOverlay" class="edit-overlay">
  <div class="edit-overlay-content">
    <span class="gen-dot" aria-hidden="true"></span>
    <p id="editOverlayText">Generating…</p>
  </div>
</div>

        <canvas id="videoCanvas"></canvas>
      </div>

      <!-- konvaStage is a sibling of .canvas, NOT inside it.
           .canvas has overflow:hidden which clips banner overflow.
           .canvas-container has overflow:visible so banners can expand freely. -->
      <div id="konvaStage"></div>

      <div id="cropContainer"></div>

      <!-- Play button -->
    </div>
    <button id="topBannerBtn" style="display: none">Add Banner</button>
    <button id="CropBtn" style="display: none">Crop</button>

    <!-- AI response message -->
    <div id="autoquence-response" class="aq-response-box" style="display:none"></div>

    <div id="cropControls" style="display:none">
      <button id="ratio169" class="aq-ctrl-btn">16:9</button>
      <button id="ratio11"  class="aq-ctrl-btn">1:1</button>
      <button id="cropApply"  class="aq-ctrl-btn aq-ctrl-apply">Apply</button>
      <button id="cropCancel" class="aq-ctrl-btn">Cancel</button>
    </div>
    <button id="playPauseBtn" class="play"></button>

    <!-- Prompt form -->

    <!-- Upload / Download Status -->
    <form id="promptForm" method="POST">
      <div class="inputWrapper">
        <input
          class="promptInput"
          type="text"
          inputmode="text"
          name="prompt"
          placeholder="Type a prompt to edit your video"
        />
        <button type="submit" class="uploadBtn" aria-label="Send">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="greenyellow" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="btnIcon">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </form>
    <!-- In <head> or just before </body> -->
    <!-- Konva is served locally (versioned + cacheable) instead of from
         unpkg — removes a cross-origin DNS/redirect round trip and a
         third-party availability risk for the whole editor. -->
    <script src="{{ static_v('vendor/konva.min.js') }}" defer></script>
    <!-- Client-side export engine: renders the canvas composition itself
         (WebCodecs/MediaRecorder) instead of server-side FFmpeg, so the
         exported file matches the preview pixel-for-pixel. -->
    <script src="{{ static_v('vendor/mp4-muxer.min.js') }}" defer></script>
    <script src="{{ static_v('animation.js') }}" defer></script>
    <script src="{{ static_v('export-engine.js') }}" defer></script>
    <script src="{{ static_v('canvas.js') }}" defer></script>

    <div id="loader" class="loader hidden">
      <div class="spinner"></div>
      <p>Processing...</p>
    </div>

    <div id="statusBox" class="status-box" style="display: none">
      <div class="spinner"></div>
      <p id="statusText">Uploading...</p>
    </div>
    
    <div id="exportOverlay" style="display: none">
      <div id="exportCard">
        <div id="exportSpinnerRing"></div>
        <p id="exportLabel">Exporting…</p>
        <div id="exportProgressTrack">
          <div id="exportProgressBar"></div>
        </div>
        <p id="exportPercent">0%</p>
      </div>
    </div>
    <!-- Firebase config must load BEFORE auth.js (module) -->
    <script src="{{ static_v('firebase-config.js') }}"></script>
    <!-- Firebase auth: session check + profile avatar -->
    <script type="module" src="{{ static_v('auth.js') }}"></script>
  </body>
</html>
